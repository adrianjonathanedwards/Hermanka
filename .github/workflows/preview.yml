# Builds the site and publishes it to GitHub Pages, for showing the client
# before launch.
#
# ⚠ THIS IS NOT THE PRODUCTION DEPLOY. Production is Cloudflare Pages, building
# from this same repository on its own; see README "Deploying". The two do not
# interact, and nothing here runs in the Cloudflare build.
#
# The preview differs from production in ways that matter when reading it:
#
#   - it is served from a subdirectory, https://<user>.github.io/Hermanka/,
#     so the build runs with BASE_PATH set (see tools/gh-pages.mjs)
#   - `_headers` and `_redirects` are Cloudflare features. GitHub Pages ignores
#     them, so the preview has no security headers and none of the 301s from
#     the old WordPress URLs. tools/gh-pages.mjs deletes both rather than ship
#     files that look live and are not.
#   - robots.txt is a blanket disallow and the sitemap is dropped, so a copy of
#     the site on a github.io hostname cannot compete with the real domain in
#     search.
#
# Delete this file and the whole preview mechanism is gone.

name: Preview (GitHub Pages)

on:
  push:
    branches: [main]
  # so a preview can be refreshed from the Actions tab without a commit
  workflow_dispatch:

# Read the repo, mint the Pages token, and (actions) look at GitHub's own Pages run
# so the deploy job can wait for it. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# One preview at a time. `cancel-in-progress: false` because a half-finished
# deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source of truth, the same file Cloudflare reads.
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` and not `npm install`: the lockfile decides, and a preview that
      # resolved different versions than production is not a preview.
      - run: npm ci

      # MUST come before the build: it is what tells us the path and origin the
      # site will actually be served from, and the build needs both. `origin` is
      # https://<owner>.github.io and `base_path` is /<repo>, so a repository
      # rename or a custom domain added later flows through without an edit here.
      - uses: actions/configure-pages@v5
        id: pages
        with:
          # Turns Pages ON if it is off. It does NOT change the source of a site
          # that is already on: a repository left on "Deploy from a branch" stays
          # there. That is what the next step is for.
          enablement: true

      # ⚠ WHY THE PREVIEW SOMETIMES SHOWS ONLY THE README.
      # On "Deploy from a branch" GitHub runs its own Jekyll build on every push
      # (the run called "pages build and deployment") IN PARALLEL with this
      # workflow, and whichever deployment finishes last is what is live. Jekyll
      # renders README.md, and it is the slower of the two, so it usually wins.
      # Setting the source to "GitHub Actions" stops that run from existing.
      # The same switch is under Settings → Pages → Build and deployment → Source.
      # This step is belt and braces: it has not been observed to stop that run
      # (it still appeared on the next push), so the deploy job below does not
      # depend on it and waits for that run instead. If the token is not allowed to
      # switch the source this only warns.
      - name: Deploy from GitHub Actions, not from the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow \
            || echo "::warning::Could not switch the Pages source. Set Settings > Pages > Build and deployment > Source to GitHub Actions, or Jekyll will keep overwriting this preview with the README."

      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          # The preview is on github.io, where there is no /api route, so the
          # calendar calls the availability Worker (worker/availability/) at its own
          # address. Public, not a secret: the Worker only returns booked dates.
          # Override with a repository variable AVAILABILITY_URL to move it.
          PUBLIC_AVAILABILITY_URL: ${{ vars.AVAILABILITY_URL || 'https://hermanka-availability.squareshare.workers.dev/api/availability' }}
        run: npm run build

      # Cheap insurance against a future component adding an absolute path that
      # tools/gh-pages.mjs does not know to rewrite: on a subpath that is a 404
      # for the reader and a green build for us, which is the worst combination
      # there is. Better to break the build here and be told.
      - name: Fail if anything still points at the domain root
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node tools/check-base.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ORDER, NOT LUCK. If GitHub is also running its own Jekyll build for this
      # commit (see the warning above) both deployments succeed and whichever lands
      # second is live. Ours has to be second, so wait for that run to finish. With
      # the source on "GitHub Actions" there is no such run and this returns at once.
      # Gives up after ~6 minutes and deploys anyway rather than blocking the preview.
      - name: Let GitHub's built-in Pages run finish first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}"               --jq '[.workflow_runs[] | select(.name == "pages build and deployment") | .status]
                    | if length == 0 then "none" elif all(. == "completed") then "done" else "running" end')
            echo "built-in pages run: $state"
            [ "$state" != "running" ] && break
            sleep 10
          done

      - id: deployment
        uses: actions/deploy-pages@v4
